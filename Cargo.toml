[package]
name = "acode"
version = "1.8.2"
edition = "2021"
authors = ["Eren Yeager <victor@atlasresearchlabs.online>"]
description = "Atlas Daedalus (acode) — Industrial Autonomous Terminal AI Coder"
license = "MIT"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
similar = { version = "2.7", features = ["text", "unicode"] }
ignore = "0.4"
regex = "1.11"
chrono = "0.4"
dotenvy = "0.15"
async-trait = "0.1"
futures-util = "0.3"
sha2 = "0.10"
tree-sitter = "0.27.1"
tree-sitter-tags = "0.27.1"
tempfile = "3.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
