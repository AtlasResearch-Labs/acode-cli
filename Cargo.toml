[package]
name = "acode"
version = "1.1.1"
edition = "2021"
authors = ["Eren Yeager <victor@atlasresearchlabs.online>"]
description = "Atlas Daedalus (acode) — Industrial Autonomous Terminal AI Coder"
license = "MIT"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
similar = { version = "2.7", features = ["text", "unicode"] }
ignore = "0.4"
regex = "1.11"
chrono = "0.4"
dotenvy = "0.15"
async-trait = "0.1"
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
